# Optional local MySQL service for future persistence.
# The current starter implementation uses in-memory repositories.
services:
  mysql:
    image: mysql:8.4
    container_name: smart-parking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_parking
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
